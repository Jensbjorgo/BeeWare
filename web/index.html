<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BeeWare – få oversikt over det som skjer rundt deg</title>
    <meta name="description" content="Del observasjoner av ubehagelige, truende eller potensielt farlige hendelser på kartet, og få bedre oversikt over det som skjer rundt deg." />
    <link rel="preload" href="/fonts/Commissioner-Variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="/vendor/leaflet.css" />
    <link rel="stylesheet" href="/styles.css?v=8" />
  </head>
  <body>
    <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" /></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21v-2a8 8 0 0 1 16 0v2" /></symbol>
        <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" /><circle cx="12" cy="12" r="2" /><path d="M12 2v3m0 14v3M2 12h3m14 0h3" /></symbol>
        <symbol id="i-send" viewBox="0 0 24 24"><path d="m21 3-7 18-4-7-7-4 18-7ZM10 14 21 3" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
        <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4c5-4 9 4 14 0v10c-5 4-9-4-14 0" /></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7" /></symbol>
        <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H5v16h5m5-12 4 4-4 4m-6-4h10" /></symbol>
        <symbol id="bee-mark" viewBox="0 0 40 40">
          <g stroke="#2c352a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="13" cy="17" rx="5" ry="8" transform="rotate(-35 13 17)" fill="#fffefa" />
            <ellipse cx="27" cy="17" rx="5" ry="8" transform="rotate(35 27 17)" fill="#fffefa" />
            <ellipse cx="20" cy="25" rx="7" ry="10" fill="#e8c547" />
            <path d="M13.5 23h13m-12.5 6h12" stroke-width="3" />
            <path d="m17 11-3-4m9 4 3-4" fill="none" />
            <circle cx="20" cy="14" r="4.5" fill="#2c352a" />
          </g>
        </symbol>
      </defs>
    </svg>
    <div class="shell">
      <button id="menuBackdrop" class="menu-backdrop" type="button" aria-label="Lukk meny" hidden></button>
      <aside class="panel" id="sidePanel" aria-label="Registrering og observasjoner">
        <div class="brand">
          <div class="brand-lockup">
            <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><use href="#bee-mark" /></svg>
            <h1>BeeWare</h1>
          </div>
          <button id="menuClose" class="icon-button" type="button" aria-label="Lukk meny"><svg class="icon" aria-hidden="true"><use href="#i-close" /></svg></button>
        </div>

        <section class="card">
          <div class="section-head">
            <h2>Ny observasjon</h2>
            <button id="locateBtn" class="ghost location-button" type="button" aria-label="Bruk min posisjon"><svg class="icon" aria-hidden="true"><use href="#i-locate" /></svg><span>Min posisjon</span></button>
          </div>

          <form id="reportForm">
            <label>
              Sted eller holdeplass
              <input id="stopInput" name="stop_name" type="text" placeholder="Søk holdeplass eller trykk i kartet" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="stopOptions" autocomplete="off" maxlength="80" />
            </label>
            <ul id="stopOptions" class="suggestions" role="listbox" aria-label="Holdeplasser" hidden></ul>

            <label>
              Linje (valgfritt)
              <input id="routeInput" name="route" type="text" placeholder="For eksempel 100 eller M1" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="routeOptions" autocomplete="off" maxlength="100" />
            </label>
            <ul id="routeOptions" class="suggestions" role="listbox" aria-label="Linjer" hidden></ul>

            <label>
              Kort beskrivelse
              <textarea id="noteInput" name="note" rows="3" maxlength="160" placeholder="For eksempel truende oppførsel ved inngangen til holdeplassen"></textarea>
            </label>

            <div class="selection">
              <div>
                <p class="meta-label">Nærmeste stopp</p>
                <p id="nearestStop" class="meta-value">Ikke hentet.</p>
              </div>
            </div>

            <button type="submit" class="primary publish-button"><svg class="icon" aria-hidden="true"><use href="#i-send" /></svg>Publiser observasjon</button>
            <p id="formStatus" class="status" role="status"></p>
          </form>
        </section>

        <section class="observations-section">
          <div class="section-head observations-heading">
            <h2>Aktive observasjoner</h2>
            <p id="ttlLabel" class="tiny"></p>
          </div>
          <p id="feedStatus" class="status error" role="status"></p>
          <div id="feed" class="feed"></div>
        </section>
      </aside>

      <main class="map-wrap">
        <button id="menuToggle" class="icon-button menu-toggle" type="button" aria-label="Åpne meny" aria-expanded="false" aria-controls="sidePanel">
          <svg class="icon" aria-hidden="true"><use href="#i-menu" /></svg>
        </button>
        <section class="auth-popover" id="authPopover" aria-label="Profil">
          <button id="authToggle" class="icon-button auth-toggle" type="button" aria-label="Åpne profil" aria-expanded="false" aria-controls="authContent">
            <svg class="icon" aria-hidden="true"><use href="#i-user" /></svg>
          </button>
          <div id="authContent" class="card hidden" hidden>
            <p id="authState" class="tiny hidden" hidden></p>
            <div id="authForms">
              <form id="loginForm" class="auth-form">
                <label>
                  Brukernavn
                  <input id="loginUsername" type="text" placeholder="brukernavn" autocomplete="username" required />
                </label>
                <label>
                  Passord
                  <input id="loginPassword" type="password" placeholder="passord" autocomplete="current-password" required />
                </label>
                <button type="submit" class="primary">Logg inn</button>
              </form>

              <form id="registerForm" class="auth-form">
                <label>
                  Nytt brukernavn
                  <input id="registerUsername" type="text" placeholder="3–24 tegn: a–z, 0–9, - og _" autocomplete="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_\-]+" title="3–24 tegn: a–z, tall, bindestrek og understrek" />
                </label>
                <label>
                  Nytt passord
                  <input id="registerPassword" type="password" placeholder="minst 6 tegn" autocomplete="new-password" required minlength="6" />
                </label>
                <button type="submit" class="ghost strong">Lag bruker</button>
              </form>
            </div>

            <div id="userPanel" class="user-panel hidden">
              <p id="currentUsername" class="profile-name"></p>
              <div class="user-stats">
                <span id="userLevel">Level 1</span>
                <span id="userXp">0 XP</span>
                <span id="userConfirmations">0 bekreftelser</span>
              </div>
              <button id="logoutBtn" class="ghost profile-logout" type="button" aria-label="Logg ut" title="Logg ut"><svg class="icon" aria-hidden="true"><use href="#i-logout" /></svg></button>
            </div>

            <p id="authStatus" class="status" role="status"></p>
          </div>
        </section>

        <div id="map"></div>
        <div class="mobile-publish mobile-only">
          <p id="mobileFormStatus" class="status" role="status"></p>
          <button id="mobilePublish" type="submit" form="reportForm" class="primary publish-button"><svg class="icon" aria-hidden="true"><use href="#i-send" /></svg>Publiser observasjon</button>
        </div>
        <p id="mapStatus" class="map-status hidden" role="status" aria-live="polite"></p>
      </main>
    </div>

    <script src="/vendor/leaflet.js"></script>
    <script src="/app.js?v=6" type="module"></script>
  </body>
</html>
